# Конфигурация для Docker окружения
telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"  # Обязательно установить через переменную окружения
  admin_user_ids: 
    - ${TELEGRAM_ADMIN_USER_ID:-123456789}  # Установить свой user_id

databases:
  - name: "voron_migr_db"
    driver: "org.postgresql.Driver"
    url: "${DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/migration}"
    username: "${DATABASE_USER:-migration}"
    password: "${DATABASE_PASSWORD:-migration}"
    jar_path: "/app/lib/postgresql.jar"
    tables:
      - name: "Воронеж 3 задача"
        sql_query: "SELECT a_status FROM BDM_FILE_TASK bdm3 JOIN cms_task t ON t.ouid=bdm3.ouid LIMIT 1"
        check_interval: 30

      - name: "Воронеж 1 задача"
        sql_query: "SELECT a_status FROM BDM_STRUCTURE_TASK bdm1 JOIN cms_task t ON t.ouid=bdm1.ouid LIMIT 1"
        check_interval: 5

      - name: "Воронеж 2 задача"
        sql_query: "SELECT a_status FROM BDM_TASK bdm2 JOIN cms_task t ON t.ouid=bdm2.ouid LIMIT 1"
        check_interval: 10

logging:
  level: "${LOG_LEVEL:-INFO}"
  file: "/app/logs/app.log"
  
monitoring:
  startup_delay: 10
  max_retries: 3
  retry_delay: 5